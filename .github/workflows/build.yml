name: Build images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  postgres-pgvector:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}:postgres_17-pgvector
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # --pull picks up the latest yolks:postgres_17 (Postgres minor/security updates).
      - name: Build and push
        run: |
          docker build --pull -t "$IMAGE" postgres-pgvector
          docker push "$IMAGE"
